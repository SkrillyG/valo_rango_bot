name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keepalive.yml"

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Mantener vivo el servicio en Render
        run: |
          curl -sS --fail-with-body --max-time 45 \
            --retry 4 --retry-delay 10 --retry-all-errors \
            -o /tmp/health.json -w "HTTP %{http_code} en %{time_total}s\n" \
            https://valo-rango-bot.onrender.com/health
          cat /tmp/health.json
