name: keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/keepalive.yml"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mantener vivo el servicio en Render
        run: curl -fsS --max-time 20 -o /dev/null -w "%{http_code}\n" https://valo-rango-bot.onrender.com/health
